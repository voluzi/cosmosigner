name: Test

on: [push]

jobs:
  test:
    name: go test (race + cover)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2026.2.2"
          install-go: false

      - name: test (race + coverage)
        run: make test-cover

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

  pkcs11:
    name: PKCS#11 (SoftHSM2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends softhsm2 opensc
      - name: Native conformance and fail-closed drill
        run: dev/pkcs11-drill.sh

  release-snapshot:
    name: Native release snapshot (Debian 12 amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: golang:1.27.3-bookworm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Debian 12 native and cross compilers
        run: apt-get update && apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Trust the mounted checkout for release tools
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Validate and build all release archives
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish
