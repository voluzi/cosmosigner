name: Test

on: [push]

jobs:
  test:
    name: go test (race + cover)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: Set up Go for staticcheck
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2026.2.1"
          install-go: false

      - name: Restore project Go version
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: test (race + coverage)
        run: make test-cover

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
